name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, sodium
          coverage: none

      # The secure storage plugin comes from plugins.nativephp.com, which needs plugin licence
      # credentials. GitHub doesn't pass secrets to pull requests from forks, so those install
      # everything else and run the tests without the plugin.
      - name: Install Composer dependencies
        run: |
          if [ -n "$COMPOSER_AUTH" ]; then
            composer install --prefer-dist --no-interaction --no-progress
          else
            echo "No COMPOSER_AUTH secret, so installing without the paid plugin."
            composer setup:free --no-interaction
          fi
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Compact prints a dot per passing test and the details of failures only. The runner's
      # terminal is 80 columns, which cuts the names of failed tests short, so widen it.
      - name: Execute tests
        run: php artisan test --compact
        env:
          COLUMNS: 200
